<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-label="Chunk Lab 主流程：上传、解析、Preview、Draft 人工审阅、Embedding、pgvector、导出或检索；Context、图片摘要、表格检索版本和 SPU 归属是 Draft 阶段的可选增强。">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f8f8a"/>
    </marker>
  </defs>

  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">
    <!-- main path boxes -->
    <g fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="20" y="84" width="124" height="62" rx="4"/>
      <rect x="168" y="84" width="124" height="62" rx="4"/>
      <rect x="316" y="84" width="124" height="62" rx="4"/>
      <rect x="464" y="84" width="124" height="62" rx="4" stroke="#0f8f8a" stroke-width="2"/>
      <rect x="612" y="84" width="124" height="62" rx="4"/>
      <rect x="760" y="84" width="124" height="62" rx="4"/>
      <rect x="908" y="84" width="112" height="62" rx="4"/>
    </g>

    <!-- main arrows -->
    <g stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)">
      <line x1="144" y1="115" x2="162" y2="115"/>
      <line x1="292" y1="115" x2="310" y2="115"/>
      <line x1="440" y1="115" x2="458" y2="115"/>
      <line x1="588" y1="115" x2="606" y2="115" stroke="#0f8f8a" marker-end="url(#arrow-accent)"/>
      <line x1="736" y1="115" x2="754" y2="115"/>
      <line x1="884" y1="115" x2="902" y2="115"/>
    </g>

    <!-- main labels -->
    <g fill="currentColor" text-anchor="middle">
      <text x="82" y="108" font-weight="600">上传</text>
      <text x="82" y="126" font-size="10.5" opacity=".72">PDF / Office / 图片</text>
      <text x="230" y="108" font-weight="600">解析</text>
      <text x="230" y="126" font-size="10.5" opacity=".72">MinerU 或本地解析</text>
      <text x="378" y="108" font-weight="600">Preview</text>
      <text x="378" y="126" font-size="10.5" opacity=".72">按策略生成提案</text>
      <text x="526" y="108" font-weight="600" fill="#0f8f8a">Draft</text>
      <text x="526" y="126" font-size="10.5" opacity=".72">人工审阅与修订</text>
      <text x="674" y="108" font-weight="600">Embedding</text>
      <text x="674" y="126" font-size="10.5" opacity=".72">合格 Chunk 向量化</text>
      <text x="822" y="108" font-weight="600">pgvector</text>
      <text x="822" y="126" font-size="10.5" opacity=".72">写入数据库</text>
      <text x="964" y="108" font-weight="600">导出 / 检索</text>
      <text x="964" y="126" font-size="10.5" opacity=".72">JSON / SPU / Recall@K</text>
    </g>

    <!-- optional bracket -->
    <g fill="none" stroke="#b26a00" stroke-width="1.2" stroke-dasharray="4 4">
      <path d="M526 146 L526 178 L166 178 L166 226"/>
      <path d="M526 178 L526 226"/>
      <path d="M526 178 L886 178 L886 226"/>
      <path d="M526 178 L526 226"/>
    </g>
    <g stroke="#b26a00" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
      <rect x="66" y="226" width="200" height="54" rx="4"/>
      <rect x="426" y="226" width="200" height="54" rx="4"/>
      <rect x="786" y="226" width="200" height="54" rx="4"/>
    </g>
    <g fill="currentColor" text-anchor="middle">
      <text x="166" y="248" font-weight="600">Context / 图片摘要</text>
      <text x="166" y="266" font-size="10.5" opacity=".72">补充背景，生成后仍需审核</text>
      <text x="526" y="248" font-weight="600">表格检索版本</text>
      <text x="526" y="266" font-size="10.5" opacity=".72">表格与文字 Chunk 建立关联</text>
      <text x="886" y="248" font-weight="600">SPU 资料归属</text>
      <text x="886" y="266" font-size="10.5" opacity=".72">按商品组织，生成 Markdown</text>
    </g>

    <!-- legend -->
    <g font-size="10.5" fill="currentColor" opacity=".75">
      <line x1="20" y1="310" x2="48" y2="310" stroke="currentColor" stroke-width="1.4"/>
      <text x="54" y="314">必做主路径</text>
      <line x1="136" y1="310" x2="164" y2="310" stroke="#b26a00" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="170" y="314">可选增强（在 Draft 阶段完成）</text>
    </g>
  </g>
</svg>
